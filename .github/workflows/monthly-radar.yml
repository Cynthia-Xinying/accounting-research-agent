name: Monthly Accounting Research Radar

on:
  workflow_dispatch:
  schedule:
    - cron: "0 9 1 * *"

jobs:
  monthly-radar:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Compute collection window
        id: window
        run: |
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import datetime as dt
          print("from_date=" + (dt.date.today() - dt.timedelta(days=31)).isoformat())
          PY

      - name: Generate monthly radar and digest
        run: |
          python3 scripts/research_integrations.py digest monthly \
            --from-date "${{ steps.window.outputs.from_date }}" \
            --collect \
            --clean \
            --limit 30

      - name: Email monthly digest
        env:
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USERNAME: ${{ secrets.SMTP_USERNAME }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          SMTP_FROM: ${{ secrets.SMTP_FROM }}
          SMTP_USE_TLS: ${{ secrets.SMTP_USE_TLS }}
          EMAIL_RECIPIENT: ${{ secrets.EMAIL_RECIPIENT }}
        run: |
          if [ -z "$SMTP_HOST" ] || [ -z "$EMAIL_RECIPIENT" ]; then
            echo "SMTP secrets are not configured; skipping email."
            exit 0
          fi
          python3 scripts/research_integrations.py digest email \
            --path data/processed/monthly_digest.md \
            --subject "Monthly Accounting Research Digest"

      - name: Upload generated reports
        uses: actions/upload-artifact@v4
        with:
          name: monthly-accounting-radar
          path: |
            data/processed/latest_report.md
            data/processed/monthly_digest.md
            exports/radar/index.html
