name: Weekly Deep Reading Queue

on:
  workflow_dispatch:
  schedule:
    - cron: "0 9 * * 1"

jobs:
  weekly-deep-reading:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Compute recommendation window
        id: window
        run: |
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import datetime as dt
          print("from_date=" + (dt.date.today() - dt.timedelta(days=7)).isoformat())
          PY

      - name: Generate weekly deep reading queue
        run: |
          python3 scripts/research_integrations.py digest weekly-deep \
            --from-date "${{ steps.window.outputs.from_date }}" \
            --limit 8

      - name: Email weekly queue
        continue-on-error: true
        env:
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USERNAME: ${{ secrets.SMTP_USERNAME }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          SMTP_FROM: ${{ secrets.SMTP_FROM }}
          SMTP_USE_TLS: ${{ secrets.SMTP_USE_TLS }}
          EMAIL_RECIPIENT: ${{ secrets.EMAIL_RECIPIENT }}
        run: |
          if [ -z "$SMTP_HOST" ] || [ -z "$EMAIL_RECIPIENT" ]; then
            echo "SMTP secrets are not configured; skipping email."
            exit 0
          fi
          echo "Attempting to send email. If this step fails, check whether the mailbox allows SMTP AUTH and app passwords."
          python3 scripts/research_integrations.py digest email \
            --path data/processed/weekly_deep_reading_queue.md \
            --subject "Weekly Accounting Deep Reading Queue"

      - name: Upload weekly queue
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: weekly-deep-reading-queue
          path: data/processed/weekly_deep_reading_queue.md
